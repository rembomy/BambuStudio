when:
  - event: tag
    ref: refs/tags/fedora-v*

labels:
  role: build
  platform: linux/amd64

concurrency: 1

steps:
  - name: build-fedora-appimage
    image: fedora:44
    volumes:
      - bambustudio-fedora44-deps:/woodpecker/src/github.com/rembomy/BambuStudio/deps/build
    commands:
      - |
        bash <<'BASH'
        set -euo pipefail

        version=$(sed -n 's/^set(SLIC3R_VERSION "\([^"]*\)")$/\1/p' version.inc)
        prefix="fedora-v$${version}-beta."
        if [[ -z "$version" || "$CI_COMMIT_TAG" != "$prefix"* || ! "$${CI_COMMIT_TAG#"$prefix"}" =~ ^[0-9]+$ ]]; then
          echo "Expected tag: $${prefix}<number>" >&2
          exit 1
        fi

        dnf install -y "https://download1.rpmfusion.org/free/fedora/rpmfusion-free-release-$(rpm -E %fedora).noarch.rpm"
        source linux.d/fedora
        dnf install -y "$${REQUIRED_DEV_PACKAGES[@]}" webkit2gtk4.1-devel procps-ng binutils

        cache_dir=deps/build
        mkdir -p "$cache_dir"
        cache_key=$(
          { git rev-parse HEAD:deps HEAD:BuildLinux.sh HEAD:linux.d/fedora; rpm -qa | LC_ALL=C sort; } |
            sha256sum | cut -d' ' -f1
        )
        cache_marker="$cache_dir/.woodpecker-cache-key"
        cache_refresh=false
        if [[ ! -f "$cache_marker" || "$(cat "$cache_marker")" != "$cache_key" ]] ||
           [[ -n "$(find "$cache_marker" -mtime +29 -print)" ]]; then
          echo "Refreshing Fedora dependency cache"
          find "$cache_dir" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          cache_refresh=true
        else
          echo "Reusing Fedora dependency cache"
        fi

        CMAKE_BUILD_PARALLEL_LEVEL=8 ./BuildLinux.sh -fd -t 2
        if [[ "$cache_refresh" == true ]]; then
          printf '%s\n' "$cache_key" > "$cache_marker"
        fi
        CMAKE_BUILD_PARALLEL_LEVEL=8 ./BuildLinux.sh -fsi -t 2
        artifact="BambuStudio_$${CI_COMMIT_TAG}_Fedora44_x86_64.AppImage"
        test -s build/BambuStudio_ubu64.AppImage
        mv build/BambuStudio_ubu64.AppImage "build/$artifact"
        (cd build && sha256sum "$artifact" > SHA256SUMS)
        BASH

  - name: draft-github-release
    image: woodpeckerci/plugin-release:0.3.1
    settings:
      api_key:
        from_secret: github_release_token
      files:
        - build/BambuStudio_fedora-v*_Fedora44_x86_64.AppImage
        - build/SHA256SUMS
      file_exists: fail
      draft: true
      prerelease: true
